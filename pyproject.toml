[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hddlab"
version = "0.1.0"
description = "Out-of-sample comparison of burn, index and daily-model pricing for a winter HDD option on Central England Temperature."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
